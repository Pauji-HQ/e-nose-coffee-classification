[package]
edition      = "2024"
name         = "hive_ota_tb"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "hive_ota_tb"
path = "./src/bin/main.rs"

# ---------------------------------------------------------------------------
# UJI OTA MINIMAL: LED berkedip (interval = bukti visual firmware berganti)
# + penerima OTA lewat MQTT. TIDAK ada ADS1115/DHT22/rekaman/TinyML -- proyek
# ini sengaja dibuat sekecil mungkin supaya uji OTA-nya sendiri gampang dibaca.
# Versi dependensi disamakan dengan hive_ota (WiFi+TLS+OTA yang sudah dirancang).
# ---------------------------------------------------------------------------
[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3", "log-04"] }
log                    = "0.4.27"

embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "dns",
  "log",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
embedded-io-async-06 = { package = "embedded-io-async", version = "0.6" }

esp-alloc = { version = "0.10.0", features = ["compat"] }
esp-backtrace = { version = "0.19.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.17.0", features = ["esp32s3", "log-04"] }
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-radio = { version = "0.18.0", features = [
  "esp-alloc",
  "esp32s3",
  "log-04",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.13.0", default-features = false, features = [
  "log",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"

rust-mqtt = { version = "0.3", default-features = false }

mbedtls-rs = { version = "0.3", features = ["log", "alg-rsa", "kex-ecdhe-rsa"] }

esp-storage = { version = "0.9", features = ["esp32s3"] }
embedded-storage = "0.3.1"

# Verifikasi checksum firmware dari ThingsBoard (SHA-256, bukan CRC32 --
# ThingsBoard Cloud otomatis pakai SHA-256, tidak bisa diganti dari UI-nya).
# Sudah diuji: hasilnya cocok dengan vektor uji SHA-256 standar.
sha2 = { version = "0.10", default-features = false }


[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = 'fat'
opt-level     = 's'
