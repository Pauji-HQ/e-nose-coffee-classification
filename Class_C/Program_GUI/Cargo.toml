[package]
name = "edge_ai_gui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29.1"
rumqttc = { version = "0.24.0", features = ["use-rustls"] }
printpdf = "0.7.0"
image = "0.25"
rfd = "0.15.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "blocking"] }